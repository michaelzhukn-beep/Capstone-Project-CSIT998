name: capstone

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: capstone_postgres
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
      POSTGRES_DB: capstone
    ports:
      # 宿主机固定 15432,避开本机默认 Postgres 占用的 5432;容器内仍是 5432。
      # 改这里必须同步改 .env 的 DB_DSN、.env.example 与 README。
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
