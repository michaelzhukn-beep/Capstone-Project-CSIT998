<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #555555; } a:hover { color: #222222; }
  </style>
</helmet>
<div style="width: 390px; height: 760px; background: #FAFAFA; color: #333333; display: flex; flex-direction: column; gap: 14px; padding: 60px 20px 24px 20px; overflow: hidden;">

  <div style="font-size: 12px; color: #888888; letter-spacing: 0.04em;">低保真 · 你提的方案</div>
  <div style="font-size: 17px; font-weight: 600;">把要求拖到优先级区域</div>

  <div style="border: 2px dashed #BBBBBB; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 120px;">
    <div style="font-size: 12px; color: #888888;">很想要</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="border: 1.5px solid #333333; background: #FFFFFF; border-radius: 8px; padding: 0 12px 0 8px; height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px;">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="#999999"><circle cx="2.5" cy="3" r="1.5"></circle><circle cx="7.5" cy="3" r="1.5"></circle><circle cx="2.5" cy="8" r="1.5"></circle><circle cx="7.5" cy="8" r="1.5"></circle><circle cx="2.5" cy="13" r="1.5"></circle><circle cx="7.5" cy="13" r="1.5"></circle></svg>
        <span>安静</span>
      </div>
      <div style="border: 1.5px solid #333333; background: #FFFFFF; border-radius: 8px; padding: 0 12px 0 8px; height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px;">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="#999999"><circle cx="2.5" cy="3" r="1.5"></circle><circle cx="7.5" cy="3" r="1.5"></circle><circle cx="2.5" cy="8" r="1.5"></circle><circle cx="7.5" cy="8" r="1.5"></circle><circle cx="2.5" cy="13" r="1.5"></circle><circle cx="7.5" cy="13" r="1.5"></circle></svg>
        <span>三房</span>
      </div>
    </div>
  </div>

  <div style="border: 2px dashed #BBBBBB; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 120px;">
    <div style="font-size: 12px; color: #888888;">有点想要</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px;">
      <div style="border: 1.5px solid #333333; background: #FFFFFF; border-radius: 8px; padding: 0 12px 0 8px; height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; transform: rotate(-3deg); box-shadow: 0 6px 16px rgba(0,0,0,0.12);">
        <svg width="10" height="16" viewBox="0 0 10 16" fill="#999999"><circle cx="2.5" cy="3" r="1.5"></circle><circle cx="7.5" cy="3" r="1.5"></circle><circle cx="2.5" cy="8" r="1.5"></circle><circle cx="7.5" cy="8" r="1.5"></circle><circle cx="2.5" cy="13" r="1.5"></circle><circle cx="7.5" cy="13" r="1.5"></circle></svg>
        <span>靠近大学</span>
      </div>
    </div>
  </div>

  <div style="border: 2px dashed #BBBBBB; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 80px;">
    <div style="font-size: 12px; color: #888888;">无所谓</div>
  </div>

  <div style="margin-top: auto; border-left: 3px solid #333333; padding: 4px 0 4px 12px; font-size: 12px; line-height: 1.6; color: #555555; text-wrap: pretty;">
    取舍:后端只有「必须 / 希望 / 排序」三档,没有权重 —— 「很想要」和「有点想要」系统区分不了,拖过去等于拖了个寂寞。拖拽在手机上还和滚动打架。所以主方案把它收成一个点击切换的条件卡;真正可用的「顺序」留给「希望」里的先后。
  </div>
</div>
</x-dc>
</body>
</html>
