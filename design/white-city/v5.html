<title>白模城市 v5 · 筑明AI</title>
<!--
  实验原型(experimental),不是线上首页。v5:斜向模型摄影构图、河岸组团与分层光照。
  - 模块:竖肋塔楼(底层发光大堂、顶部收分)、横向楼板中层楼(部分楼层暖光)、退台屋顶花园、
    围合院落、低层排屋、玻璃亭广场、公园;蓬松白树;前景河道 + 拱桥;远处淡山。
  - 高低有致:塔楼只在"聚集区"成簇出现(城市坐标上的平滑场),近景不出高楼。
  - 色调:中性纯白。暖色只留给大堂与少数楼层的灯光(泛光)。
  - 运动:城市由西向东平移;每移过一个地块宽,内容顺移一列并在西侧补新列,河道与桥随城市坐标连续。
  直接双击打开即可(需要联网加载 Three.js 与字体)。
-->

<style>
  :root {
    --bg: #F6F6F4; --ink: #151614; --sub: #5E5E5A; --mute: #8C8C88; --line: rgba(60, 60, 56, .16);
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --sans: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased; overflow: hidden; }

  #city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .veil { position: fixed; inset: auto 0 0; height: 14vh; pointer-events: none;

  .ui { position: fixed; inset: 0; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  .brand { position: absolute; left: clamp(28px, 4.4vw, 76px); top: clamp(40px, 8vh, 84px); }
  .brand b { display: block; font-size: clamp(22px, 1.9vw, 32px); font-weight: 700; letter-spacing: .01em; }
  .brand span { display: block; margin-top: 8px; font-size: 12.5px; letter-spacing: .08em; line-height: 1.7; color: var(--sub); }
  .brand i { display: block; width: 82px; height: 1.5px; margin-top: clamp(28px, 6vh, 56px); background: var(--ink); }
  .spine { position: absolute; left: clamp(20px, 2.9vw, 48px); top: 7vh; bottom: 30vh; width: 1px; background: var(--line); }
  .top { position: absolute; right: clamp(24px, 4vw, 70px); top: 34px; display: flex; align-items: center; gap: clamp(20px, 2.6vw, 46px); font-size: 15px; }
  .top .lang { padding: 5px 14px; border-radius: 999px; background: rgba(255,255,255,.8); font-weight: 600; font-size: 14px; }
  .rail { position: absolute; left: clamp(28px, 4.4vw, 76px); top: 31vh; width: clamp(140px, 11vw, 190px); list-style: none; margin: 0; padding: 0; }
  .rail li { position: relative; padding: 14px 0 18px; border-bottom: 1px solid var(--line); font-size: 13px; letter-spacing: .06em; color: var(--mute); }
  .rail li b { display: block; font-size: 14px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .rail li::after { content: ""; position: absolute; right: -2px; bottom: -3px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
  .copy { position: absolute; left: clamp(250px, 22.5vw, 400px); top: 16.5vh; }
  .copy h1 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: clamp(44px, 4.7vw, 84px); line-height: 1.22; letter-spacing: .01em; }
  .copy p { margin: clamp(18px, 3vh, 32px) 0 0; font-size: clamp(16px, 1.5vw, 25px); line-height: 1.7; color: var(--sub); letter-spacing: .02em; }
  .composer { position: absolute; left: clamp(200px, 19.5vw, 350px); top: 53vh; width: min(1020px, 61vw); height: 76px;
    display: flex; align-items: center; gap: 18px; padding: 0 9px 0 28px; border-radius: 999px; background: #fff;

  .composer svg.s { flex: 0 0 auto; color: #56564F; }

  .aside { position: absolute; right: clamp(24px, 4vw, 70px); top: 22vh; padding-left: 18px; border-left: 1px solid var(--line);
    font-size: 14px; line-height: 1.9; letter-spacing: .08em; color: var(--sub); }
  .foot-l { position: absolute; left: clamp(28px, 4.4vw, 76px); bottom: 5vh; font-size: 13.5px; line-height: 1.9; letter-spacing: .08em; color: var(--sub); }
  .foot-c { position: absolute; left: 50%; bottom: 4.4vh; transform: translateX(-50%); font-size: 15px; letter-spacing: 1.1em; text-indent: 1.1em; color: var(--sub); white-space: nowrap; }
  .foot-r { position: absolute; right: clamp(24px, 3.2vw, 56px); bottom: 4.4vh; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 15px; letter-spacing: .04em; color: var(--sub); }
  .foot-r span { display: flex; align-items: center; gap: 12px; }
  .foot-r i { width: 12px; height: 12px; border: 1.5px solid currentColor; }
  .foot-r i.f { background: currentColor; box-shadow: inset 0 0 0 2px #fff; }
  .hud { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); display: flex; gap: 8px; align-items: center;
    padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.82); border: 1px solid var(--line);
    font: 11px/1.4 var(--mono); color: var(--sub); z-index: 5; white-space: nowrap; }
  .hud button { padding: 2px 8px; border: 1px solid var(--line); border-radius: 5px; background: #fff; font: inherit; }
  .hud input { width: 70px; }
  .fallback { position: fixed; inset: 0; display: none; place-items: center; color: var(--mute); font-size: 13px; }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const qs = new URLSearchParams(location.search);
// 诊断/对比开关:
//   seed=N   固定随机种子,同一种子每次生成同一座城
//   ao=0     关闭 AO 混合(深度仍更新),默认开启
//   env=1    环境光照(RoomEnvironment) tm=agx  AgX 色调映射
//   glow=soft 柔光晕(整体轻泛光)       pool=1   灯光在地面/墙脚的暖色光斑
//   lod=0    远景不降精度               sfar=1   阴影覆盖到远景
//   dpr=2    超采样                     hazefar=0 雾化提早
// URL 参数只供诊断对比;默认固定种子便于复现与交接。
//   treefix=0 复现旧的树木跳变   trees=0.5 保留树的比例
//   exp=N 曝光   fglow=1 立面内透暖光   lights=few 只留底层灯
// 默认:受控的场景环境光 + 柔化主光阴影 + GTAO + 稀疏大堂局部光 + 选择性泛光。
const DEFAULTS = { lod: '0', hazefar: '1', glow: 'light', pool: '1', trees: '0.72', exp: '1.12', fglow: '0', lights: 'selected', shadow: '.72', ao: '1', env: '1', seed: '42' };
const OPT = k => (qs.has(k) ? qs.get(k) : (DEFAULTS[k] ?? null));
const FGLOW = OPT('fglow') === '1', FEW = OPT('lights') === 'few';
const ON = k => { const v = OPT(k); return v !== null && v !== '0'; };
const SEED = +(OPT('seed') || (Date.now() % 100000));

// ================================================================== 渲染器
const canvas = document.getElementById('city');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' }); }
catch (e) { document.getElementById('fallback').style.display = 'grid'; throw e; }
renderer.setPixelRatio(OPT('dpr') ? +OPT('dpr') : Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.info.autoReset = false;
renderer.toneMapping = OPT('tm') === 'agx' ? THREE.AgXToneMapping : THREE.NeutralToneMapping;
renderer.toneMappingExposure = OPT('exp') ? +OPT('exp') : 1.55;

const BG = new THREE.Color('#F6F6F4');
const scene = new THREE.Scene();
scene.background = BG;

// 斜向俯视看到屋顶、前后立面与河岸;viewOffset 让模型落在文字下方。
const camera = new THREE.PerspectiveCamera(30, 1, 5, 5000);
camera.position.set(400, 320, 380);
camera.lookAt(0, 0, -760);

// 光:明亮的中性天光为主;主光从左前上方来,朝镜头的立面是亮的,影子落向后方、很淡
// 光照强度刻意压低(白墙线性亮度 ≈ 1),亮度交给曝光;否则白墙本身超过泛光阈值,整片发虚
// 天光略降、主光略升:亮面到顶白,侧面留一层浅灰,体积感靠明暗面而不是靠整体压暗
const hemi = new THREE.HemisphereLight(0xf2f6ff, 0xd6cdbd, .45);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff5e4, 1.55);
sun.position.set(-650, 900, -100);
sun.target.position.set(0, 0, -640);
sun.castShadow = true;
sun.shadow.mapSize.set(ON('sfar') ? 8192 : 4096, ON('sfar') ? 8192 : 4096);
Object.assign(sun.shadow.camera, ON('sfar')
  ? { left: -1700, right: 1700, top: 1500, bottom: -1500, near: 50, far: 4000 }
  : { left: -900, right: 900, top: 760, bottom: -760, near: 50, far: 3000 });
sun.shadow.bias = -0.0002;
sun.shadow.radius = 2.5;
sun.shadow.normalBias = .12;
sun.shadow.intensity = +OPT('shadow');   // 影子只留形体提示;深了整片发灰
scene.add(sun, sun.target);

// ================================================================== 构件库
// 纯白白模:玻璃和窗框只比白墙略深一点点,读得出分格即可,不许把整栋楼拉成灰色
const C = { white: [.95, .95, .935], glass: [.86, .88, .88], soft: [.92, .93, .915], path: [.97, .97, .955], frame: [.89, .90, .885], rail: [.97, .975, .978] };

function paint(g, rgb, glowBase = null) {
  g = g.index ? g.toNonIndexed() : g;
  g.deleteAttribute('uv');
  if (!g.attributes.normal) g.computeVertexNormals();
  const n = g.attributes.position.count, c = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { c[i * 3] = rgb[0]; c[i * 3 + 1] = rgb[1]; c[i * 3 + 2] = rgb[2]; }
  g.setAttribute('color', new THREE.BufferAttribute(c, 3));
  // aGlow:从 glowBase(世界高度)起向上 14 m 由 1 衰减到 0;不发光的构件为 0
  const gl = new Float32Array(n);
  if (glowBase !== null) for (let i = 0; i < n; i++) { const t = Math.max(0, 1 - (g.attributes.position.getY(i) - glowBase) / 14); gl[i] = t * t; }
  g.setAttribute('aGlow', new THREE.BufferAttribute(gl, 1));
  return g;
}
const boxGeo = (x, y, z, w, h, d, rgb = C.white) => {
  // 可读的大体块有小倒角接高光;细窗梃保持轻量盒体。
  const g = w > 5 && d > 5 && h > .5
    ? new RoundedBoxGeometry(w, h, d, 1, Math.min(.22, h * .15))
    : new THREE.BoxGeometry(w, h, d);
  return paint(g.translate(x, y + h / 2, z), rgb);
};

function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

class Kit {
  constructor(seed) { this.r = rng(seed); this.hi = []; this.lo = []; this.glow = []; this.trees = []; }
  box(x, y, z, w, h, d, rgb = C.white) { this.hi.push(boxGeo(x, y, z, w, h, d, rgb)); }
  lod(x, y, z, w, h, d) { this.lo.push(boxGeo(x, y, z, w, h, d)); }
  light(x, y, z, w, h, d) {
    if (y > 1.5 && (FEW || this.r() > .22)) return;
    this.glow.push(boxGeo(x, y, z, w, h, d));
  }
  /** 分段玻璃芯,底部带内透光(fglow)。 */
  glassCore(x, y, z, w, h, d, lit) {
    const seg = Math.max(1, Math.ceil(h / 3.4));
    this.hi.push(paint(new THREE.BoxGeometry(w, h, d, 1, seg, 1).translate(x, y + h / 2, z), C.glass, lit && FGLOW ? y : null));
  }
  tree(x, z, s = 1, y = 0) { this.trees.push([x, y, z, s]); }

  /** 竖肋塔楼:底层发光大堂 + 四角立柱 + 四面细密竖肋 + 顶部两级收分。全是竖向构件,可沿 y 缩放。 */
  ribbed(x, y0, z, w, d, H, o = {}) {
    const pitch = o.pitch || 1.7, lobby = o.lobby === false ? 0 : 4.6;
    if (lobby) {
      this.light(x, y0, z, w - 1.6, lobby - .2, d - 1.6);
      [[-1, -1], [1, -1], [1, 1], [-1, 1]].forEach(([a, b]) => this.box(x + a * (w / 2 - .5), y0, z + b * (d / 2 - .5), 1, lobby, 1));
      this.box(x, y0 + lobby - .6, z, w + .3, .6, d + .3);
    }
    const yb = y0 + lobby, h = H - lobby;
    this.glassCore(x, yb, z, w - .9, h, d - .9, false);
    const fins = (len, fn) => { const n = Math.max(3, Math.round(len / pitch)); for (let i = 0; i <= n; i++) fn(-len / 2 + i * len / n, i === 0 || i === n); };
    fins(w, (fx, edge) => { const t = edge ? .9 : .26;
      this.box(x + fx, yb, z + d / 2 - .3, t, h, .6); this.box(x + fx, yb, z - d / 2 + .3, t, h, .6); });
    fins(d, (fz, edge) => { const t = edge ? .9 : .26;
      this.box(x + w / 2 - .3, yb, z + fz, .6, h, t); this.box(x - w / 2 + .3, yb, z + fz, .6, h, t); });
    // 每约 17 m 一道细腰线,打断竖向的单调
    for (let yy = yb + 17; yy < y0 + H - 6; yy += 17) this.box(x, yy, z, w + .12, .32, d + .12);
    if (o.crown !== false) {
      this.box(x, y0 + H, z, w + .4, .9, d + .4);
      const cw = w * .72, cd = d * .72;
      this.box(x, y0 + H + .9, z, cw - .4, 3.6, cd - .4, C.glass);
      // 顶部百叶:一圈更细的竖片
      const lou = (len, fn) => { const n = Math.max(3, Math.round(len / 1.1)); for (let i = 0; i <= n; i++) fn(-len / 2 + i * len / n); };
      lou(cw, fx => { this.box(x + fx, y0 + H + .9, z + cd / 2 - .15, .16, 3.6, .3); this.box(x + fx, y0 + H + .9, z - cd / 2 + .15, .16, 3.6, .3); });
      lou(cd, fz => { this.box(x + cw / 2 - .15, y0 + H + .9, z + fz, .3, 3.6, .16); this.box(x - cw / 2 + .15, y0 + H + .9, z + fz, .3, 3.6, .16); });
      this.box(x, y0 + H + 4.5, z, cw + .2, .5, cd + .2);
      this.box(x, y0 + H + 5, z, w * .42, 2.6, d * .42, C.soft);
      if (o.antenna) this.box(x + w * .1, y0 + H + 7.6, z, .35, 9, .35);
    }
    this.lod(x, y0, z, w, H + (o.crown !== false ? 4 : 0), d);
  }

  /** 横向楼板的中层楼:浅灰玻璃芯 + 每层外挑楼板 + 稀疏竖梃 + 指定楼层暖光 + 女儿墙。不可沿 y 缩放。 */
  banded(x, y0, z, w, d, floors, o = {}) {
    const FH = 3.4, H = floors * FH, ins = .9, mul = o.mullion || 4.2;
    this.glassCore(x, y0, z, w - ins * 2, H, d - ins * 2, (o.lit || []).includes(0));
    // 玻璃分格:贴在玻璃芯表面的细竖梃,1.6 m 一格
    const cw = w - ins * 2, cd = d - ins * 2;
    const grid = (len, fn) => { const n = Math.max(2, Math.round(len / 1.6)); for (let i = 1; i < n; i++) fn(-len / 2 + i * len / n); };
    grid(cw, fx => { this.box(x + fx, y0, z + cd / 2 + .04, .1, H, .1, C.frame); this.box(x + fx, y0, z - cd / 2 - .04, .1, H, .1, C.frame); });
    grid(cd, fz => { this.box(x + cw / 2 + .04, y0, z + fz, .1, H, .1, C.frame); this.box(x - cw / 2 - .04, y0, z + fz, .1, H, .1, C.frame); });
    if (o.balcony) for (let f = 1; f < floors; f++) {
      this.box(x, y0 + f * FH - .3, z + d / 2 + .7, w * .86, .3, 1.4);

function newLot(c, r) {
  const lx = (c - COLS / 2) * PITCH, z = Z_NEAR - r * PITCH, cx = cityXOf(lx), rand = R;
  const dRiver = Math.abs(z - riverZ(cx)), dBlvd = Math.abs(z - blvdZ(cx));
  if (dRiver < RIVER_HALF + 18 || dBlvd < BLVD_HALF + 14) return { kind: -1 };
  const rot = Math.floor(rand() * 4);
  // 河前留白,让桥和水面成为前景主体,不要用排屋遮住整个河岸。
  if (z > riverZ(cx) + RIVER_HALF) {
    return { kind: -1 };
  }
  if (dRiver < RIVER_HALF + 85)
    return { kind: rand() < .25 ? PARK : MODULES.findIndex(m => m.key ===
      (rand() < .55 ? 'waterfront-gallery' : 'terrace-garden')), rot, ys: 1 };
  // 成组的天际线:右侧主峰、左侧次峰,中段低矮,而不是给所有地块相同概率。
  const peak = Math.exp(-(((cx - 430) / 260) ** 2 + ((z + 1010) / 250) ** 2));
  const secondary = .6 * Math.exp(-(((cx + 530) / 200) ** 2 + ((z + 940) / 200) ** 2));
  const cluster = Math.max(peak, secondary);
  if (rand() < cluster * .8)
    return { kind: TALL[Math.floor(rand() * TALL.length)], rot, ys: .75 + cluster * .75 + rand() * .18 };
  const u = rand();
  if (u < .17) return { kind: -1 };
  if (u < .34) return { kind: PARK, rot, ys: 1 };
  if (u < .64) return { kind: MID[Math.floor(rand() * MID.length)], rot, ys: 1 };

function curveRibbon(fn, half, y, offsets = [[-half, half]]) {
  const p = [], x0 = (-COLS / 2 - 2) * PITCH, x1 = (COLS / 2 + 2) * PITCH, step = 6;
  for (let x = x0; x < x1; x += step) {
    const za = fn(cityXOf(x)), zb = fn(cityXOf(x + step));
    for (const [a, b] of offsets) {
      p.push(x, y, za + a, x + step, y, zb + b, x + step, y, zb + a, x, y, za + a, x, y, za + b, x + step, y, zb + b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.computeVertexNormals();
  return g;
}
function bankGeometry() {
  const parts = [], x0 = (-COLS / 2 - 2) * PITCH, x1 = (COLS / 2 + 2) * PITCH, step = 8;
  for (let x = x0; x < x1; x += step) {

    [-1, 1].forEach(side => parts.push(paint(new THREE.BoxGeometry(step + .4, 1.4, 3).rotateY(-ang).translate(x + step / 2, .7, z + side * (RIVER_HALF + 1.5)), C.white)));

  return mergeGeometries(parts);
}

function rebuild() {
  kinds.forEach(k => { k.hi.count = k.lo.count = 0; if (k.glow) k.glow.count = 0; });
  pools.count = 0;
  const lightSites = [];
  treesNear.count = treesFar.count = plinths.count = bridges.count = 0;
  const treeOk = (wx, wz) => Math.abs(wz - riverZ(cityXOf(wx))) > RIVER_HALF + 4 && Math.abs(wz - blvdZ(cityXOf(wx))) > BLVD_HALF + 2;
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    const lot = grid[c][r];
    const gx = (c - COLS / 2) * PITCH, gz = Z_NEAR - r * PITCH;
    const x = gx + (hash2(cityXOf(gx), gz) - .5) * 8;
    const z = gz + (hash2(gz, cityXOf(gx)) - .5) * 8;

    M.compose(V.set(x, 0, z), Q, S.set(1, 1, 1));
    plinths.setMatrixAt(plinths.count++, M);
    M.compose(V.set(x, 0, z), Q, S.set(1, lot.ys, 1));
    const body = far ? K.lo : K.hi;
    body.setMatrixAt(body.count++, M);
    if (K.glow) {
      K.glow.setMatrixAt(K.glow.count++, M);
      M2.compose(V2.set(x, .45, z), Q, S.set(46, 1, 46)); pools.setMatrixAt(pools.count++, M2);
      if (Math.abs(z - riverZ(cityXOf(x))) < 170 && Math.abs(x) < 750)
        lightSites.push({ x, z, rank: Math.abs(z - riverZ(cityXOf(x))) + Math.abs(x) * .03 });
    }
    const tm = dist > 1600 ? treesFar : treesNear;
    const placed = [];
    for (const [tx, ty, tz, s] of K.trees) {
      if (tm.count >= TREE_CAP) break;
      V2.set(tx, ty * lot.ys, tz).applyQuaternion(Q);
      const wx = x + V2.x, wz = z + V2.z;
      if (ty === 0 && !treeOk(wx, wz)) continue;
      if (TREE_FIX) {
        // 随机量只取自"城市坐标",城市怎么平移、网格怎么顺移都不变 —— 同一棵树永远是同一棵
        const cxw = cityXOf(wx), h = hash2(cxw, wz);
        if (h > TREE_KEEP) continue;
        if (placed.some(([px, pz]) => (px - wx) ** 2 + (pz - wz) ** 2 < 49)) continue;   // 同地块内间距 ≥ 7 m
        placed.push([wx, wz]);
        Q2.setFromAxisAngle(UP, hash2(wz, cxw) * 6.283);
      } else {
        Q2.setFromAxisAngle(UP, (tx * 12.99 + tz * 78.23 + c) % 6.283);   // 旧:含列号 c,每次顺移都会变
      }
      M2.compose(V.set(wx, V2.y, wz), Q2, S.setScalar(s * TREE_SCALE));
      tm.setMatrixAt(tm.count++, M2);
    }
  }
  // 河岸行道树(只在近中景)
  const RSTEP = TREE_FIX ? 24 : 26;
  const rStart = TREE_FIX ? Math.ceil(cityXOf((-COLS / 2) * PITCH) / RSTEP) * RSTEP + shift * PITCH : (-COLS / 2) * PITCH;
  for (let x = rStart; x < (COLS / 2) * PITCH; x += RSTEP) {
    // 修复后:x 对齐到城市坐标的 52 m 网格,树跟着城市走;旧逻辑按屏幕网格取点,每次顺移整排往回跳
    const cx = cityXOf(x), z = riverZ(cx);
    [-1, 1].forEach(side => {
      if (treesNear.count >= TREE_CAP) return;
      const hh = hash2(cx, side);
      const wz = z + side * (RIVER_HALF + 8 + (TREE_FIX ? hh * 3 : ((cx * 7.3) % 3)));
      M2.compose(V.set(x, 0, wz), Q2.setFromAxisAngle(UP, TREE_FIX ? hh * 6.28 : cx % 6.28), S.setScalar((TREE_FIX ? .9 + hh * .35 : 1 + ((cx * 3.1) % .4)) * TREE_SCALE));
      treesNear.setMatrixAt(treesNear.count++, M2);
    });
  }
  // 桥:大道与河交叉处之外,每三条南北向道路架一座,垂直于河道走向
  for (let c = 0; c < COLS; c++) {
    const col = c - shift;
    if (((col % 8) + 8) % 8 !== 0) continue;
    const x = (c - COLS / 2) * PITCH + PITCH / 2, cx = cityXOf(x);
    Q.setFromAxisAngle(UP, Math.atan2(-riverSlope(cx), 1));
    M.compose(V.set(x, 0, riverZ(cx)), Q, S.set(1, 1, 1));
    bridges.setMatrixAt(bridges.count++, M);
  }
  water.geometry.dispose(); water.geometry = curveRibbon(riverZ, RIVER_HALF, .05);
  banks.geometry.dispose(); banks.geometry = bankGeometry();
  blvd.geometry.dispose(); blvd.geometry = curveRibbon(blvdZ, BLVD_HALF, .12);
  kinds.forEach(k => { k.hi.instanceMatrix.needsUpdate = k.lo.instanceMatrix.needsUpdate = true; if (k.glow) k.glow.instanceMatrix.needsUpdate = true; });
  [treesNear, treesFar, plinths, bridges, pools].forEach(m => { m.instanceMatrix.needsUpdate = true; });
  const chosenLights = [];
  lightSites.sort((a, b) => a.rank - b.rank).forEach(site => {
    if (chosenLights.length < lobbyLights.length && !chosenLights.some(p => Math.hypot(p.x - site.x, p.z - site.z) < 110))
      chosenLights.push(site);
  });
  lobbyLights.forEach((light, i) => {
    const site = chosenLights[i]; light.intensity = site ? 210 : 0;
    if (site) light.position.set(site.x, 3.5, site.z + 16);
  });
}

// ================================================================== 后期:AO → 空气雾化 → 灯光泛光
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, 1, 1);
gtao.updateGtaoMaterial({ radius: 3.2, distanceExponent: 1.5, thickness: 1.8, scale: 1, samples: 16, distanceFallOff: 1, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 5, rings: 2, samples: 16 });
gtao.blendIntensity = .65;
composer.addPass(gtao);
const haze = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tDepth: { value: null }, uBg: { value: new THREE.Vector3(BG.r, BG.g, BG.b) },
    uNear: { value: camera.near }, uFar: { value: camera.far }, uStart: { value: 1900 }, uEnd: { value: 3300 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    #include <packing>
    uniform sampler2D tDiffuse; uniform sampler2D tDepth; uniform vec3 uBg;
    uniform float uNear; uniform float uFar; uniform float uStart; uniform float uEnd;
    varying vec2 vUv;
    void main() {
      vec4 c = texture2D(tDiffuse, vUv);
      float d = texture2D(tDepth, vUv).x;
      float dist = -perspectiveDepthToViewZ(d, uNear, uFar);
      float f = d >= .9999 ? 1.0 : smoothstep(uStart, uEnd, dist);
      f = f * .9 + step(.9999, d) * .1;
      gl_FragColor = vec4(mix(c.rgb, uBg, f), c.a);
    }`,
});
haze.uniforms.tDepth.value = gtao.depthTexture;   // ShaderPass 会克隆 uniforms,深度贴图须构造后再挂
const bloom = OPT('glow') === 'soft'
  ? new UnrealBloomPass(new THREE.Vector2(1, 1), .32, .9, .92)      // 柔光晕:亮白处也泛一点光
  : new UnrealBloomPass(new THREE.Vector2(1, 1), .24, .55, 2.5);     // 只让灯光发光
composer.addPass(bloom);
composer.addPass(new OutputPass());
// 在输出色域中和网页底色融合;曝光只影响模型,不把空白背景压成灰色。
haze.uniforms.uBg.value.set(246 / 255, 246 / 255, 244 / 255);
composer.addPass(haze);
// 雾化深度图来自 GTAO 那一遍渲染;GTAO 一关,那张深度图就不再更新,雾化会一直按"关掉那一刻"的楼的位置算,
// 城市移动后出现残影、忽虚忽实。所以 AO 关时改用材质内雾(逐像素、永远和几何同步)。
if (!ON('hazefar')) { haze.uniforms.uStart.value = 1250; haze.uniforms.uEnd.value = 2400; }
let aoEnabled = OPT('ao') === '1';
function syncHaze() {
  // AO 关闭只关混合,深度仍每帧更新,雾化不会留下移动残影。
  gtao.enabled = true; gtao.blendIntensity = aoEnabled ? .65 : 0;
  haze.enabled = true; scene.fog = null;
}
syncHaze();

// ================================================================== 尺寸与运动
let needsRender = true;
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w / h < 1 ? 44 : 30;
  camera.setViewOffset(w, h, 0, -h * .26, w, h);
  camera.updateProjectionMatrix();
  rebuild(); needsRender = true;
}
window.addEventListener('resize', resize);
resize();

const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const state = { speed: 1, playing: !reduced.matches, t: 0, last: performance.now(), frames: 0, fpsT: performance.now() };
const BASE_SPEED = 1.8;
function advance(dt) {
  state.t += dt;
  const dx = BASE_SPEED * state.speed * dt;
  city.position.x += dx;
  let shifted = false;
  while (city.position.x >= PITCH) {
    city.position.x -= PITCH; shift++;
    grid.pop(); grid.unshift(Array.from({ length: ROWS }, (_, r) => newLot(0, r)));
    shifted = true;
  }
  if (shifted) rebuild();
}
function draw() { renderer.info.reset(); composer.render(); }
function tick(now) {
  if (document.hidden || (!state.playing && !needsRender)) { state.last = now; return; }
  if (!needsRender && now - state.last < 1000 / 30) return;
  const dt = Math.min(.05, (now - state.last) / 1000); state.last = now;
  if (state.playing) advance(dt);
  draw(); needsRender = false;
  state.frames++;
  if (now - state.fpsT > 1000) {
    document.getElementById('h-fps').textContent = Math.round(state.frames * 1000 / (now - state.fpsT)) + ' fps';
    document.getElementById('h-tri').textContent = (renderer.info.render.triangles / 1e6).toFixed(2) + 'M tri';
    state.frames = 0; state.fpsT = now;
  }
}
if (qs.has('t')) advance(+qs.get('t'));
draw();
renderer.setAnimationLoop(tick);

window.__trees = () => {
  const out = [], m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), sc = new THREE.Vector3();
  city.updateMatrixWorld();
  for (const tm of [treesNear, treesFar]) for (let i = 0; i < tm.count; i++) {
    tm.getMatrixAt(i, m); m.premultiply(city.matrixWorld); m.decompose(p, q, sc);
    out.push([p.x, p.z, 2 * Math.atan2(q.y, q.w), sc.x]);
  }
  return out;
};
window.__city = {
  renderAt(s) { advance(s); draw(); return { x: city.position.x, shift }; },
  info: () => ({ modules: MODULES.length, trisHi: Object.fromEntries(kinds.map(k => [k.def.key, k.hi.geometry.attributes.position.count / 3])),
    placed: kinds.reduce((n, k) => n + k.hi.count + k.lo.count, 0), trees: treesNear.count + treesFar.count, bridges: bridges.count }),
};
const $ = id => document.getElementById(id);
$('h-play').textContent = state.playing ? '暂停' : '播放';
$('h-play').onclick = () => { state.playing = !state.playing; needsRender = true; $('h-play').textContent = state.playing ? '暂停' : '播放'; };
$('h-speed').oninput = e => { state.speed = +e.target.value; };
$('h-ao').onclick = () => { aoEnabled = !aoEnabled; syncHaze(); needsRender = true; $('h-ao').textContent = 'AO:' + (aoEnabled ? '开' : '关'); };
$('h-ao').textContent = 'AO:' + (aoEnabled ? '开' : '关');
$('h-bloom').onclick = () => { bloom.enabled = !bloom.enabled; needsRender = true; kinds.forEach(k => k.glow && (k.glow.visible = bloom.enabled)); lobbyLights.forEach(l => l.visible = bloom.enabled); pools.visible = bloom.enabled && ON('pool'); $('h-bloom').textContent = '灯光:' + (bloom.enabled ? '开' : '关'); };
</script>
</body>
</html>
