<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f5f2">
  <title>筑明AI · 城市沙盘 v28</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
  <style>
    :root { --bg: #f6f5f2; --ink: #353b34; --soft: #7f857b; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Microsoft YaHei", Arial, sans-serif; }
    #stage { position: relative; width: 100%; max-height: 100vh; margin: 0 auto; overflow: hidden; background: var(--bg); }
    #viewport, #viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #stage::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10%; pointer-events: none;
      background: linear-gradient(to bottom, rgba(246,245,242,0), var(--bg)); }
    .hero { position: absolute; top: 9.5%; left: 0; right: 0; text-align: center; z-index: 3; pointer-events: none; }
    .hero .brand { font-size: clamp(11px, .9vw, 17px); color: var(--soft); letter-spacing: .06em; }
    .hero h1 { margin: .5em 0 .9em; font-weight: 500; font-size: clamp(22px, 2.3vw, 44px); }
    .hero input { pointer-events: auto; width: min(660px, 82vw); height: clamp(40px, 2.9vw, 56px); border-radius: 999px;
      border: 1px solid #cdd0c8; background: #fcfcfa; padding: 0 1.6em; font: inherit; font-size: clamp(13px, .9vw, 17px); color: var(--ink); outline: none;
      transition: border-color .2s, box-shadow .2s; }
    .hero input:focus { border-color: #9aa396; box-shadow: 0 6px 24px rgba(40,50,40,.08); }
    .hero .hint { margin-top: .8em; font-size: clamp(11px, .75vw, 14px); color: var(--soft); min-height: 1.4em; }
    #signs { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .sign { position: absolute; left: 0; top: 0; width: 390px; height: 620px; transform-origin: 0 0; padding: 0; border: 0;
      background: none; cursor: pointer; pointer-events: auto; text-align: left; font: inherit; opacity: 0; }
    .sign[tabindex="-1"] { pointer-events: none; }
    .sign-in { position: absolute; inset: 0; padding: 72px 34px 0; display: flex; flex-direction: column; color: #22262a;
      transition: transform .25s ease, box-shadow .25s ease; }
    .sign-in b { font-size: 62px; line-height: 1.2; letter-spacing: .01em; margin: 30px 0 0; }
    .sign .dash { display: block; width: 40px; height: 6px; background: #2f9646; }
    .sign .ln { margin-top: 18px; font-size: 44px; line-height: 1.4; color: #3d423d; }
    .sign .go { margin-top: auto; margin-bottom: 70px; font-size: 32px; color: #22262a; border-bottom: 2px solid #9a9e9a; align-self: flex-start; padding-bottom: 6px; }
    .sign .go em { font-style: normal; display: inline-block; transition: transform .25s ease; }
    .sign:hover .sign-in, .sign:focus-visible .sign-in { transform: translateY(-10px); }
    .sign:hover .go em, .sign:focus-visible .go em { transform: translateX(10px); }
    .sign:focus-visible { outline: none; }
    .sign:focus-visible .sign-in { box-shadow: 0 0 0 6px rgba(47,150,70,.35); }
    [hidden] { display: none !important; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; color: var(--soft); background: var(--bg); }
    @media (prefers-reduced-motion: reduce) { .sign-in, .sign .go em { transition: none; } }
  </style>
</head>
<body>
  <main id="stage" aria-label="城市沙盘与户型样板">
    <div id="viewport" data-loaded="false" aria-hidden="true"></div>
    <div id="signs"></div>
    <div class="hero">
      <div class="brand">NESTWISE · 筑明AI</div>
      <h1>用一句话,找到想住的城市一角</h1>
      <input id="query" type="text" autocomplete="off" placeholder="例如:通勤 30 分钟内、安静、预算 80 万的两居室" aria-label="描述想找的房子">
      <div class="hint" id="hint"></div>
    </div>
    <div id="loading">正在加载城市沙盘…</div>
  </main>
  <script type="module" src="showroom-v28.mjs?v=1"></script>
</body>
</html>
