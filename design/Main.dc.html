<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #226B8E; } a:hover { color: #1A5573; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F4F0; color: #1D1D1F; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 58px 20px 6px 20px;">
    <div style="font-size: 17px; font-weight: 600; letter-spacing: -0.01em;">找房</div>
    <div style="font-size: 15px; color: #6E6E73;">新对话</div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 10px 20px 0 20px; overflow: hidden;">

    <div style="align-self: flex-end; max-width: 280px; background: #1D1D1F; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 15px; line-height: 1.45;">我想要安静、靠近大学的三房</div>

    <div style="font-size: 15px; line-height: 1.5; color: #1D1D1F; text-wrap: pretty;">明白。我把你的要求整理成了下面几条 —— 哪条不对,点一下就能改。</div>

    <div style="background: #FFFFFF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.05);">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 13px; font-weight: 600; color: #6E6E73; letter-spacing: 0.02em;">你的条件</div>
        <div style="font-size: 12px; color: #6E6E73;">3 条</div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; color: #6E6E73;">必须 · 不满足的不会出现</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <div style="background: #1D1D1F; color: #FFFFFF; border-radius: 999px; padding: 0 14px; min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 500;">3 房</div>
          <div style="border: 1px dashed #C9C8C3; color: #6E6E73; border-radius: 999px; padding: 0 14px; min-height: 44px; display: flex; align-items: center; font-size: 14px;">预算 未定</div>
          <div style="border: 1px dashed #C9C8C3; color: #6E6E73; border-radius: 999px; padding: 0 14px; min-height: 44px; display: flex; align-items: center; font-size: 14px;">区域 未定</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; color: #6E6E73;">希望 · 满足不了会告诉你,不会硬凑</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <div style="background: #EFEEEA; color: #1D1D1F; border-radius: 999px; padding: 0 12px 0 14px; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;">
            <span>安静 ≥ 60</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
          </div>
          <div style="background: #EFEEEA; color: #1D1D1F; border-radius: 999px; padding: 0 12px 0 14px; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;">
            <span>距大学 ≤ 1.5 km</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12px; color: #6E6E73;">排序</div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <div style="border: 1px solid #E6E5E1; background: #FFFFFF; color: #1D1D1F; border-radius: 999px; padding: 0 12px 0 14px; min-height: 44px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="2" stroke-linecap="round"><path d="M3 6h18"></path><path d="M6 12h12"></path><path d="M9 18h6"></path></svg>
            <span>安静度 从高到低</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
        </div>
      </div>

      <div style="font-size: 12px; color: #6E6E73; line-height: 1.5;">点一下在「必须」和「希望」之间切换 · 左滑删除</div>
    </div>

    <div style="font-size: 15px; line-height: 1.5; color: #1D1D1F; text-wrap: pretty;">没提预算,我先在全库找。补一句「100 万以内」能缩很多。</div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="font-size: 13px; color: #6E6E73;">在 5,000 套候选里找到 5 套</div>
      <div style="background: #226B8E; color: #FFFFFF; border-radius: 999px; height: 44px; padding: 0 20px; display: flex; align-items: center; font-size: 15px; font-weight: 600;">看结果</div>
    </div>
  </div>

  <div style="padding: 12px 20px 30px 20px; display: flex; gap: 10px; align-items: center;">
    <div style="flex: 1 1 auto; height: 48px; background: #FFFFFF; border: 1px solid #E6E5E1; border-radius: 999px; padding: 0 18px; display: flex; align-items: center; font-size: 15px; color: #9A9A9E;">补充要求,或直接问…</div>
    <div style="width: 44px; height: 44px; border-radius: 999px; background: #1D1D1F; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
